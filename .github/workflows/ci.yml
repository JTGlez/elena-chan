name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make test-tools

  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libopus0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - run: make check-server-lock
      - run: make setup-server
      - run: make test-server

  firmware:
    strategy:
      matrix:
        include:
          - board: elena-stackchan
            variant: elena-stackchan
          - board: m5stack/core-s3
            variant: m5stack-core-s3
    runs-on: ubuntu-24.04
    container:
      # v6.1; see "Update dependencies" in AGENTS.md
      image: espressif/idf@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Test build scripts
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          python -m unittest discover -s scripts/tests
          cd docker/firmware-builder
          python -m unittest test_firmware_builder
      - name: Build selected board
        working-directory: firmware
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          python scripts/build.py "${{ matrix.board }}" --name "${{ matrix.variant }}"
          git diff --exit-code -- dependencies.lock
